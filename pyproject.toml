[project]
name = "signoz-llm-proxy"
version = "0.1.0"
description = "One-line local LLM observability: an OpenAI-compatible proxy that captures anyone's AI usage into self-hosted SigNoz"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["proxy", "shared"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
